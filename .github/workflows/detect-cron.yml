name: Build Changed Cron

on:
  push:
    branches:
      - main
    paths:
      - "tasks/**"

permissions:
  id-token: write
  contents: read

jobs:
  detect-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed cron folders
        id: detect
        shell: bash
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          CRONS=$(echo "$CHANGED_FILES" \
            | grep '^tasks/' \
            | cut -d/ -f2 \
            | sort -u)

          echo "Changed cron jobs:"
          echo "$CRONS"

          echo "crons=$CRONS" >> "$GITHUB_OUTPUT"

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["value"])')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python3 - "$PAYLOAD" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("aud =", claims.get("aud"))
          print("sub =", claims.get("sub"))
          print("repository =", claims.get("repository"))
          print("ref =", claims.get("ref"))
          print("repository_owner =", claims.get("repository_owner"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::229531317968:role/central-cron-deploy-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push changed cron images
        shell: bash
        run: |
          for CRON in ${{ steps.detect.outputs.crons }}; do
            echo "Building $CRON"

            ECR_REPO="229531317968.dkr.ecr.us-east-1.amazonaws.com/central-cron/$CRON"

            docker build \
              -t "$ECR_REPO:${GITHUB_SHA}" \
              -t "$ECR_REPO:latest" \
              "tasks/$CRON"

            docker push "$ECR_REPO:${GITHUB_SHA}"
            docker push "$ECR_REPO:latest"

            echo "Successfully pushed $CRON"
          done
