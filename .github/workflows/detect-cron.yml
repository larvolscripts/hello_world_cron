name: Build Deploy And Sync Crons

on:
  push:
    branches:
      - main
    paths:
      - "tasks/**"
      - "cron-config.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "229531317968"
  ECS_EXECUTION_ROLE: arn:aws:iam::229531317968:role/ecsTaskExecutionRole
  CLOUDWATCH_LOG_GROUP: /ecs/central-cron
  SCHEDULER_ROLE_ARN: arn:aws:iam::229531317968:role/central-cron-scheduler-role
  LAMBDA_ARN: arn:aws:lambda:us-east-1:229531317968:function:central-cron-launcher

jobs:

  detect:
    runs-on: ubuntu-latest

    outputs:
      crons: ${{ steps.detect.outputs.crons }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed cron folders
        id: detect
        shell: bash
        run: |
          CHANGED_FILES=$(git diff --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}")

          echo "Changed files:"
          echo "$CHANGED_FILES"

          CRONS=$(echo "$CHANGED_FILES" \
            | grep '^tasks/' \
            | cut -d/ -f2 \
            | sort -u || true)

          if [ -z "$CRONS" ]; then
            CRON_JSON="[]"
          else
            CRON_JSON=$(printf '%s\n' "$CRONS" | jq -R . | jq -sc .)
          fi

          echo "crons=$CRON_JSON" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.crons != '[]'

    strategy:
      fail-fast: false
      matrix:
        cron: ${{ fromJSON(needs.detect.outputs.crons) }}

    runs-on: ubuntu-latest

    concurrency:
      group: central-cron-${{ matrix.cron }}
      cancel-in-progress: true

    steps:
      - name: Debounce rapid pushes
        run: sleep 30

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::229531317968:role/central-cron-deploy-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and deploy cron
        shell: bash
        env:
          CRON: ${{ matrix.cron }}
        run: |
          CPU=$(python3 -c "
          import yaml
          c=yaml.safe_load(open('cron-config.yml'))
          print(c['$CRON']['cpu'])
          ")

          MEMORY=$(python3 -c "
          import yaml
          c=yaml.safe_load(open('cron-config.yml'))
          print(c['$CRON']['memory'])
          ")

          REPO_NAME="central-cron/$CRON"
          ECR_REPO="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO_NAME"

          aws ecr describe-repositories \
            --repository-names "$REPO_NAME" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$REPO_NAME"

          docker build \
            -t "$ECR_REPO:${GITHUB_SHA}" \
            -t "$ECR_REPO:latest" \
            "tasks/$CRON"

          docker push "$ECR_REPO:${GITHUB_SHA}"
          docker push "$ECR_REPO:latest"

          aws ecs register-task-definition \
            --family "central-cron-$CRON" \
            --requires-compatibilities FARGATE \
            --network-mode awsvpc \
            --cpu "$CPU" \
            --memory "$MEMORY" \
            --execution-role-arn "$ECS_EXECUTION_ROLE" \
            --container-definitions "[
              {
                \"name\": \"$CRON\",
                \"image\": \"$ECR_REPO:${GITHUB_SHA}\",
                \"essential\": true,
                \"logConfiguration\": {
                  \"logDriver\": \"awslogs\",
                  \"options\": {
                    \"awslogs-group\": \"$CLOUDWATCH_LOG_GROUP\",
                    \"awslogs-region\": \"$AWS_REGION\",
                    \"awslogs-stream-prefix\": \"$CRON\"
                  }
                }
              }
            ]"

          echo "$CRON deployed successfully."

  sync-schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::229531317968:role/central-cron-deploy-role
          aws-region: us-east-1

      - name: Sync EventBridge schedules
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import subprocess
          import yaml

          with open("cron-config.yml") as f:
              config = yaml.safe_load(f) or {}

          for cron, values in config.items():
              if not values.get("enabled", False):
                  print(f"{cron}: disabled, skipping")
                  continue

              schedule = values.get("schedule")
              timezone = values.get("timezone", "Asia/Kolkata")

              if not schedule:
                  print(f"{cron}: no schedule, skipping")
                  continue

              name = f"central-cron-{cron}"

              target = json.dumps({
                  "Arn": "arn:aws:lambda:us-east-1:229531317968:function:central-cron-launcher",
                  "RoleArn": "arn:aws:iam::229531317968:role/central-cron-scheduler-role",
                  "Input": json.dumps({"cron": cron})
              })

              exists = subprocess.run(
                  [
                      "aws", "scheduler", "get-schedule",
                      "--name", name,
                      "--group-name", "default"
                  ],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              ).returncode == 0

              command = "update-schedule" if exists else "create-schedule"

              print(f"{cron}: {command} → {schedule} ({timezone})")

              subprocess.run([
                  "aws", "scheduler", command,
                  "--name", name,
                  "--group-name", "default",
                  "--schedule-expression", schedule,
                  "--schedule-expression-timezone", timezone,
                  "--flexible-time-window", '{"Mode":"OFF"}',
                  "--target", target,
                  "--state", "ENABLED"
              ], check=True)

          PY
