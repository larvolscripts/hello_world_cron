name: Build And Run Changed Cron

on:
  push:
    branches:
      - main
    paths:
      - "tasks/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "229531317968"
  ECS_CLUSTER: central-cron-cluster
  ECS_EXECUTION_ROLE: arn:aws:iam::229531317968:role/ecsTaskExecutionRole
  ECS_SUBNET: subnet-02148812e74b20c7c
  ECS_SECURITY_GROUP: sg-04c206d6d99bfdd2f
  CLOUDWATCH_LOG_GROUP: /ecs/central-cron

jobs:
  detect-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Detect changed cron folders
        id: detect
        shell: bash
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          CRONS=$(echo "$CHANGED_FILES" \
            | grep '^tasks/' \
            | cut -d/ -f2 \
            | sort -u \
            | tr '\n' ' ')

          echo "Changed cron jobs:"
          echo "$CRONS"

          echo "crons=$CRONS" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::229531317968:role/central-cron-deploy-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build deploy and run changed crons
        shell: bash
        run: |
          for CRON in ${{ steps.detect.outputs.crons }}; do

            echo "================================="
            echo "Processing $CRON"
            echo "================================="

            CPU=$(python3 -c "
          import yaml
          config=yaml.safe_load(open('cron-config.yml'))
          print(config['$CRON']['cpu'])
          ")

            MEMORY=$(python3 -c "
          import yaml
          config=yaml.safe_load(open('cron-config.yml'))
          print(config['$CRON']['memory'])
          ")

            echo "CPU: $CPU"
            echo "Memory: $MEMORY"

            REPO_NAME="central-cron/$CRON"
            ECR_REPO="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO_NAME"

            echo "Checking ECR repository..."

            aws ecr describe-repositories \
              --repository-names "$REPO_NAME" \
              --region "$AWS_REGION" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "$REPO_NAME" \
              --region "$AWS_REGION"

            echo "Building Docker image..."

            docker build \
              -t "$ECR_REPO:${GITHUB_SHA}" \
              -t "$ECR_REPO:latest" \
              "tasks/$CRON"

            docker push "$ECR_REPO:${GITHUB_SHA}"
            docker push "$ECR_REPO:latest"

            echo "Registering ECS task definition..."

            TASK_DEF_ARN=$(aws ecs register-task-definition \
              --family "central-cron-$CRON" \
              --requires-compatibilities FARGATE \
              --network-mode awsvpc \
              --cpu "$CPU" \
              --memory "$MEMORY" \
              --execution-role-arn "$ECS_EXECUTION_ROLE" \
              --container-definitions "[
                {
                  \"name\": \"$CRON\",
                  \"image\": \"$ECR_REPO:${GITHUB_SHA}\",
                  \"essential\": true,
                  \"logConfiguration\": {
                    \"logDriver\": \"awslogs\",
                    \"options\": {
                      \"awslogs-group\": \"$CLOUDWATCH_LOG_GROUP\",
                      \"awslogs-region\": \"$AWS_REGION\",
                      \"awslogs-stream-prefix\": \"$CRON\"
                    }
                  }
                }
              ]" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)

            echo "Task definition created:"
            echo "$TASK_DEF_ARN"

            echo "Running Fargate task..."

            aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --launch-type FARGATE \
              --task-definition "$TASK_DEF_ARN" \
              --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNET],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=DISABLED}"

            echo "$CRON deployed and started successfully."
          done
